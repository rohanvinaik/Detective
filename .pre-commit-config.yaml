# The local half of CI's lint gates, run on the files a commit touches.
# Install once:  uvx pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        # CI lints the package and its tests; docs/ and dev/ are formatted but not linted.
        files: ^(Detective|tests)/
      - id: ruff-format
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
