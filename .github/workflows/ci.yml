name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Wesker resolves via `uv` (no sibling checkout needed): `[tool.uv.sources]` in pyproject.toml
# points it at the GitHub main branch, because Detective and Wesker are co-developed and land
# together — the published PyPI Wesker lags main, so installing `Wesker>=0.11.2` from PyPI would
# pull a Wesker predating the features these integration tests exercise, and CI would go red on
# green code. The published wheel's dependency stays `Wesker>=0.11.2` (uv sources do not enter the
# wheel); the user-installs-from-PyPI experience is verified at RELEASE, not on every main push.
jobs:
  test:
    # Matrix over the Python versions the classifiers CLAIM (3.11/3.12/3.13) and two OSes. This
    # project does fd-level capture, subprocess isolation, and in-process pytest sessions — exactly
    # the surface that breaks across versions and platforms — so a single ubuntu/3.11 job left the
    # classifier claims and macOS (the primary dev platform) asserted but unverified.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: Detective
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: Detective
        # --python overrides the repo .python-version pin so each cell resolves its own interpreter.
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        working-directory: Detective
        run: uv run ruff check Detective/ tests/

      - name: Format check
        working-directory: Detective
        # Whole-tree, not just Detective/ tests/ (#34): docs/theory/*.py drifted unformatted for a
        # release because the gate did not reach docs/. The declared format contract is the repo.
        run: uv run ruff format --check .

      - name: Test with coverage
        working-directory: Detective
        # `-ra` reports every SKIP with its reason. Without it a skipped test is a dot, and a
        # capability whose only real tests skip is indistinguishable in the log from one that
        # passed — which is how the array-input work went unexercised here for a whole wave (S11).
        # The `-q` that used to be here was REDUNDANT: pyproject's addopts already sets it, so this
        # ran as `-qq`, which suppresses pytest's summary line entirely. CI was not printing its own
        # test count (S16).
        run: uv run pytest tests/ --cov=Detective --cov-report=xml:coverage.xml -ra

  package:
    # The artifact gate. One cell: an sdist's CONTENTS do not vary by OS or interpreter, so a
    # matrix here would buy six identical answers.
    #
    # What it catches and what it cannot, stated because the difference is the whole point. In a
    # fresh clone the working tree IS the tracked set, so this run proves the build itself does not
    # generate files into the tree and package them, and that no exclude has been dropped. It
    # CANNOT catch the failure that actually happened before 1.0.0 — untracked output sitting in a
    # developer's tree and getting swept in — because CI has no such tree. That case is caught only
    # by running `python3 scripts/check_sdist.py` locally before publishing, which is why it is in
    # the pre-push gate too. A green job here is not a licence to skip the local one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Detective

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build sdist and wheel
        working-directory: Detective
        run: uv build --out-dir dist

      - name: Sdist carries only tracked files
        working-directory: Detective
        run: python3 scripts/check_sdist.py
