sonar.projectKey=rohanvinaik_Detective
sonar.organization=rohanvinaik

sonar.projectName=Detective
sonar.projectVersion=0.1.0

# Source layout — the package is Detective/, not src/
sonar.sources=Detective/
sonar.tests=tests/
sonar.python.version=3.11,3.12,3.13

# Coverage report (pytest-cov; CI writes coverage.xml, the local pre-push recipe does too).
# Mutation-completeness is per pure function, not per project: the pinned decision surface reads
# ~100% and the I/O shell (cli/engine orchestration) drags the overall number down — report it
# honestly, never inflate it with pragmas. The gate grades coverage on NEW code.
sonar.python.coverage.reportPaths=coverage.xml

# The files coverage.py itself does not measure — `[tool.coverage.run] omit` in pyproject: the CLI
# shell (subprocess-driven, the I/O boundary the pinning doctrine leaves unmeasured) and the two
# package entry stubs. Without this line Sonar reads an OMITTED file as 0% covered (measured:
# 68.4% "coverage" against coverage.py's own 82.9%), which is a mismatch between two configs, not
# a measurement. Keep the two lists identical.
sonar.coverage.exclusions=Detective/cli.py,Detective/__main__.py,Detective/__init__.py

# Exclusions — keep metrics honest by excluding non-production code
sonar.exclusions=\
  **/.claude/**,\
  **/.detective/**,\
  **/.wesker/**,\
  **/__pycache__/**,\
  **/*.md,\
  docs/**,\
  dev/**,\
  uv.lock

# Engine-written synths under tests/detective/ are characterizations regenerated wholesale by
# `detective converge` — pytest still COLLECTS and runs them (that is the pinning), but Sonar must
# not lint or size them as authored code.
sonar.test.inclusions=tests/**/*.py
sonar.test.exclusions=tests/detective/**

# Don't flag test files for duplication or complexity
sonar.cpd.exclusions=tests/**

# Tolerated false positives (deterministic, reproducible in forks).
# Detective is a local CLI / agent-invoked tool: project_root, file and function come from the
# command line, an MCP call from a local client, or a repo walk — never from HTTP or network
# input, so the taint-analysis security rules do not apply.
# S2083: Path traversal — path inputs originate from the local filesystem or CLI args.
# S6549: Path construction from user-controlled data — same rationale as S2083.
# S5852: ReDoS — regex inputs come from local source files / tool output, never network input.
sonar.issue.ignore.multicriteria=fp1,fp2,fp3
sonar.issue.ignore.multicriteria.fp1.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.fp1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.fp2.ruleKey=python:S5852
sonar.issue.ignore.multicriteria.fp2.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.fp3.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.fp3.resourceKey=**/*.py
