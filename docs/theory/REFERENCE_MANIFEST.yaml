# The reference corpus for the negative-specification work, machine-checkable.
#
# Verify:  python docs/theory/check_reference_manifest.py
#
# WHY hashes and not copies. The theory priors live in ARC_AGI_3, which is their
# home and where they are maintained. Forking copies into this repo would create
# two truths and silent drift. Instead we record path + sha256 of the ORIGINAL,
# so a prior changing under a claim that cites it FAILS LOUDLY instead of quietly
# invalidating the claim. `external_root` makes the location configurable; a
# missing root is reported as UNRESOLVED, never as a pass (Law 3 shape: a vacuous
# check is a failure).
#
# `verified: false` on an external citation means RECALLED, NOT LOOKED UP. Those
# must not be quoted publicly until checked. This field is the whole point of the
# manifest for externals — it is the difference between a citation and a memory.

external_root: ~/Projects/ARC_AGI_3

